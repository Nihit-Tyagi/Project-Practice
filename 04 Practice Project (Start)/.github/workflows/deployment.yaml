name: Deployment Exercise 1
on: push
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps: 
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Test Code
        run: npm test
      - name: Build code
        run: npm run build
      - name: Deploy code
        run: echo "Deploying code to production server"